# Cấu hình khử nhiễu phím
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# Cấu hình enconder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Cấu hình công suất phát BLE
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Khắc phục lỗi báo cáo pin trên Windows
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Cấu hình màn hình OLED
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Font mặc định LVGL = Montserrat 12 (kèm glyph FontAwesome cho icon
# USB/WiFi/pin/caps-lock). Font mặc định UNSCII 8 không có glyph icon
# → mọi icon hiển thị ô vuông.
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_12=y

# Hiển thị phần trăm pin trên OLED (mỗi nửa hiển thị pin của chính nó)
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
# Báo cáo/refresh mức pin mỗi 60 giây
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Cấu hình quản lý năng lượng
# Idle 15 phút: OLED tắt (BLE vẫn giữ kết nối — quay lại gõ là sáng lại)
CONFIG_ZMK_IDLE_TIMEOUT=900000
CONFIG_ZMK_SLEEP=y
# Sau 120 phút không chạm: deep sleep (System OFF, ngắt BLE, ~30µA,
# first keypress chỉ đánh thức). Cắm USB thì không bao giờ deep sleep.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# Cấu hình đánh thức
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_USB=y

# Cấu hình ZMK Studio
CONFIG_ZMK_STUDIO_LOCKING=n
# Hỗ trợ intel
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# === BLE HIỆU NĂNG CAO (pin 2000mAh — ưu tiên phản hồi) ===
# Interval ngắn cố định ~15ms: phím phản hồi tức thì
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=200
# Bật radio 2M PHY: truyền gấp đôi tốc độ (tắt experimental conn vì nó disable 2M)
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=n

# Cấu hình đèn nền RGB
# Đã tắt vì PCB Sofle RGB MX chưa hàn LED (SK6812MINI-E)
# Khi hàn đủ LED, bỏ comment các dòng dưới và kiểm tra chân data LED
# theo build guide của PandaKB trước khi bật lại
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
# CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
# CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=30
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Tự động tắt RGB khi idle
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Cải thiện ổn định kết nối BLE
CONFIG_BT_BUF_ACL_RX_SIZE=512
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251


# Không xóa bond khi khởi động
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n
