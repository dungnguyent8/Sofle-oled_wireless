# === CONF RIÊNG NỬA TRÁI (central) — B2 ===
# Chỉ bật custom status screen trên màn trái; màn phải vẫn dùng built-in
# (cách ly debug: nếu màn phải chết thì thủ phạm chính là nó, không phải conf chung)

# Dùng status screen tự viết thay built-in
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# QUAN TRỌNG: default pool 4096 chỉ áp dụng khi dùng BUILT_IN screen.
# Với CUSTOM screen, pool rơi về 2048 byte → LVGL hết memory lúc tạo
# widgets → crash lúc boot. Nâng lên 16KB cho dư giãn (5 widgets + labels).
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# Widgets màn trái dùng: battery %, output status, layer name, HID indicators
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y

# HID indicators (Caps/Num/Scroll Lock) — chỉ central nhận được từ host
CONFIG_ZMK_HID_INDICATORS=y
# Xoay nội dung OLED trái 90° CW (top -> phải): UI thành màn dọc 64x128
# (phục vụ panel đã gắn xoay dọc). Tắt = quay về layout ngang 128x64.
CONFIG_ZMK_DISPLAY_ROTATE_90_RIGHT=y
# Flex layout cho màn dọc (stack widget theo cột)
CONFIG_LV_USE_FLEX=y

# Font nhỏ hơn cho màn dọc 64px: Montserrat 12 -> 8 (mặc định trong choice
# của ZMK là 12; không có size 10 — chỉ 8/12/14/16...)
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_8=y

# Man doc 64px: hien % pin dang "icon + 87%" (~40px) de bi clip 2 ben —
# tat percentage, chi giu icon battery moi 60s refresh (sofle.conf dat
# CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y cho ca 2-man config,
# day la override rieng cua man trai)
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=n

# VDB buffer LVGL 100% man (1024B cho 64x128): moi frame = 1 chunk duy nhat,
# khong tach man thanh nhieu chunk roi ghep — ghep chunk (y-round 8px) tao
# artifact cham tran tren man khi dung flush transpose tu viet trong
# display_rotation.c. Tang RAM +~400B, nhung sach se.
CONFIG_LV_Z_VDB_SIZE=100