# === CONF RIÊNG NỬA PHẢI (peripheral) — B3 ===
# Custom screen: bongo cat (meo danh may theo phim bam that) + pin %

# Dùng status screen tự viết thay built-in
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# LVGL flags cho bongo cat animimg
CONFIG_LV_USE_IMG=y
CONFIG_LV_USE_ANIMIMG=y

# Widget màn phải dùng
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
# Icon trang thai ket noi ve central (WiFi ✓/✗) — goc tren trai
CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=y

# Pool LVGL 16KB (custom screen không được default 4096 như built-in;
# animimg + ảnh cần nhiều hơn — phòng thiếu memory runtime)
CONFIG_LV_Z_MEM_POOL_SIZE=16384
