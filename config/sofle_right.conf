# === CONF RIÊNG NỬA PHẢI (peripheral) — B3 ===
# Custom screen: bongo cat (meo danh may theo phim bam that) + pin %

# Dùng status screen tự viết thay built-in
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# LVGL flags cho bongo cat animimg
CONFIG_LV_USE_IMG=y
CONFIG_LV_USE_ANIMIMG=y

# Widget màn phải dùng
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
# Icon trang thai ket noi ve central (WiFi ✓/✗) — goc tren trai
CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=y

# Pool LVGL 16KB (custom screen không được default 4096 như built-in;
# animimg + ảnh cần nhiều hơn — phòng thiếu memory runtime)
CONFIG_LV_Z_MEM_POOL_SIZE=16384

# ==== LED per-key 5x WS2812 (16/09) — chi nua PHAI co LED ====
# Overlay rgb_right.overlay dinh chain 5 LED vao D10 qua SPI3 (ws2812-spi).
# Behavior &rgb_ug co locality GLOBAL → bam phim o nAO cung dieu khien duoc
# (central tu forward xuong peripheral qua split transport).
CONFIG_ZMK_RGB_UNDERGLOW=y

# ⚠️ TAT coupling ext-power (16/09 — DA TE): EXT_POWER=y khi thi RGB_TOG cat
# chan EXT (P0.13) = cat VCC ca LED + OLED. LED bat lai OK (chi can data),
# nhung OLED mat init (charge pump...) va KHONG tu re-init → man den ngam
# toi khi restart. Voi EXT_POWER=n, RGB_TOG chi tat LED (5x WS2812 idle
# ~3mA — khong dang ke voi pin 5000mAh).
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Brightness: 5 LED sat phim trong tam mat — ha thap tranh choi
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20

# Buoc adjust (hue/sat/brightness) de tin chinh nhanh: 12 don vi/lan
CONFIG_ZMK_RGB_UNDERGLOW_HUE_STEP=12
CONFIG_ZMK_RGB_UNDERGLOW_SAT_STEP=12
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=6

# Mau khoi dau: trang am (hue 30°, sat 15% — gan trang, khong choi)
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=30
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=15

# Per-LED gradient (engine patch): moi LED +18° hue → 5 LED lech mau dan
CONFIG_ZMK_RGB_UNDERGLOW_PERLED_HUE_STEP=18
