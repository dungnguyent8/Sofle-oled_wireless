# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # Nửa trái: OLED đã thay bằng panel 1.3" 128x64 (SH1106) — cần overlay
  # EXTRA_DTC_OVERLAY_FILE. Ai dùng màn gốc 0.96" 128x32: XÓA flag
  # `-DEXTRA_DTC_OVERLAY_FILE=...` ở dưới (giữ nguyên -DCONFIG_ZMK_STUDIO=y)
  # — xem docs/LOCAL_BUILD_SETUP.md mục "OLED gốc 128x32".
  - board: nice_nano_v2
    shield: sofle_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DEXTRA_DTC_OVERLAY_FILE=config/oled_128x64_left.overlay
  - board: nice_nano_v2
    shield: sofle_right
  - board: nice_nano_v2
    shield: settings_reset
